<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Our Anniversary Memory Game ❤️</h1>

    <div class="floating-elements"></div>

    <form class="unlock" id="unlock">
        <p>Enter our passcode to load the photos.</p>
        <p class="hint" id="hint"></p>
        <input id="pass" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Passcode" aria-label="Passcode">
        <button type="submit">Start</button>
        <p class="error" id="error" role="alert"></p>
    </form>

    <section class="memory-game" hidden>
        </section>

    <script src="script.js"></script>
</body>
</html>
